[pytest]
addopts = --alluredir=temps --clean-alluredir -vs
markers =
    api: 接口测试
    web: UI测试
    ut: 单元测试
    login: 登录相关
    pay: 支付相关
    ddt: 测试数据驱动
    dt: 测试失败重跑插件

# 日志文件位置
log_file = ./logs/pytest.log
# 日志文件等级
log_file_level = info
# 日志文件格式
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s]  :  %(message)s
# 日志文件时间格式
log_file_date_format = %Y-%m-%d %H:%M:%S

; 记录用例执行结果
result_log_enable = 1
; 记录用例分割线
result_log_separator = 1
; 分割线等级
result_log_level_separator = warning
; 异常信息等级
result_log_level_verbose = info